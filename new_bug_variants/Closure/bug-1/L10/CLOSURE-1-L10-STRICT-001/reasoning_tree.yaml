schema_version: d4j-reasoning-tree/v1
variant_id: CLOSURE-1-L10-STRICT-001
level: L10
unit_count: 14
semantic_root: An object-literal accessor must keep its declared formal parameter, so unused-formal elimination has to exempt accessor-owned functions.
gold:
  class: com.google.javascript.jscomp.RemoveUnusedVars
  method: removeUnreferencedFunctionArgs
semantic_units:
  - {id: K01, inference: "The failure is an AST invariant violation reporting that an accessor key must declare exactly one parameter, so the optimized tree contains an accessor whose formal list was emptied.", depends_on: [], evidence: [failure_output], role: "Binds the symptom to a concrete tree mutation rather than to a printing or parsing difference."}
  - {id: K02, inference: "In the trigger input the accessor's single formal is never read inside its body, so it is a legitimate candidate for unused-formal elimination.", depends_on: [], evidence: [test.patch], role: "Establishes why any pass would consider removing it."}
  - {id: K03, inference: "The same input contains an ordinary function whose unused formal the expected output does drop, so removing unused formals is intended behaviour and not itself the defect.", depends_on: [], evidence: [test.patch], role: "Eliminates the pass-scheduling site as the fault: the feature is meant to run."}
  - {id: K04, inference: "The component that raised the violation only reports invariant breaches and performs no tree mutation, so the most prominent class in the failure is not the faulty one.", depends_on: [K01], evidence: [failure_output, "src/com/google/javascript/jscomp/AstValidator.java"], role: "Eliminates the validator, which is the highest-salience decoy in the evidence."}
  - {id: K05, inference: "The violation is raised while the optimization phase is running, so the mutation was performed by an optimization pass rather than during parsing, AST construction or normalization.", depends_on: [K01], evidence: [failure_output], role: "Eliminates the entire front end as a location."}
  - {id: K06, inference: "The trigger enables only unused-variable removal and leaves call optimization off, so the scheduled pass is the plain unused-variable-removal construction rather than the combined call-optimization construction.", depends_on: [K03, K05], evidence: [test.patch, "src/com/google/javascript/jscomp/DefaultPassConfig.java"], role: "Joins configuration and phase evidence to select one pass instance and one construction site."}
  - {id: K07, inference: "Because both unused-variable options are enabled, that construction enables global removal, so the pass's early global-removal guard does not return and the body is reached.", depends_on: [K06], evidence: ["src/com/google/javascript/jscomp/DefaultPassConfig.java", "src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Eliminates the early-return guard as the explanation and proves the mutating body executes."}
  - {id: K08, inference: "That same construction disables call-site modification, so the pass takes its direct formal-stripping branch instead of delegating to the call-site optimizer.", depends_on: [K06], evidence: ["src/com/google/javascript/jscomp/DefaultPassConfig.java", "src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Eliminates the call-site optimizer and its caller-modification predicate."}
  - {id: K09, inference: "Therefore the executed mutation is the trailing-formal strip loop, which removes trailing formals whose variable is absent from the referenced set.", depends_on: [K02, K07, K08], evidence: ["src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Joins candidacy, guard ordering and branch selection onto the exact mutating code."}
  - {id: K10, inference: "Reference collection classified both formals correctly, because the ordinary function's formal is dropped exactly as expected, so the defect is not in reference collection or referenced-set bookkeeping.", depends_on: [K03, K09], evidence: [test.patch, "src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Eliminates the reference-collecting callback and the referenced-variable marking helpers."}
  - {id: K11, inference: "The strip loop is preceded by a dedicated guard whose stated purpose is to exempt object-literal accessors, so the intended protection exists in this method and failed to fire.", depends_on: [K09], evidence: ["src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Identifies the protection that should have prevented the mutation."}
  - {id: K12, inference: "The helper that guard consults still answers true for an accessor key node, so the helper is correct and the defect lies in what the guard supplies to it.", depends_on: [K11], evidence: ["src/com/google/javascript/jscomp/NodeUtil.java"], role: "Eliminates the shared AST helper, the nearest and most plausible alternative owner."}
  - {id: K13, inference: "In this AST an object-literal accessor key is the parent of its function node, so a guard that tests the function node itself can never observe an accessor key and is unconditionally inert.", depends_on: [K01, K12], evidence: ["src/com/google/javascript/jscomp/RemoveUnusedVars.java", "src/com/google/javascript/jscomp/NodeUtil.java"], role: "Joins the observed damage with the helper's correctness to state the root cause."}
  - {id: K14, inference: "The method that owns both the inert guard and the executed strip loop is therefore the single production method that must be modified.", depends_on: [K09, K10, K13], evidence: ["src/com/google/javascript/jscomp/RemoveUnusedVars.java"], role: "Final join identifying the gold method."}
